name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.hyouka --project-name mail mail_generated
            rm -rf android
            cp -r mail_generated/android android
            rm -rf mail_generated
          fi

      - name: Get packages
        run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Validate Google OAuth configuration
        env:
          GOOGLE_SERVER_CLIENT_ID: 1057557137418-g440cu974hf39b1k4qhumag6lhbpkdnb.apps.googleusercontent.com
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVER_CLIENT_ID"
          case "$GOOGLE_SERVER_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo "ERROR: GOOGLE_SERVER_CLIENT_ID is not a Google OAuth client ID."
              exit 1
              ;;
          esac

          APPLICATION_ID="$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n1)"
          if [ "$APPLICATION_ID" != "com.hyouka.mail" ]; then
            echo "ERROR: unexpected Android applicationId: $APPLICATION_ID"
            exit 1
          fi

          echo "Android applicationId: $APPLICATION_ID"
          echo "Web/server client ID: $GOOGLE_SERVER_CLIENT_ID"
          echo "Google OAuth Android client is configured with the stable release certificate SHA-1."

      - name: Validate release signing key
        env:
          MAIL_RELEASE_KEYSTORE_BASE64: ${{ secrets.MAIL_RELEASE_KEYSTORE_BASE64 }}
          MAIL_KEYSTORE_PASSWORD: ${{ secrets.MAIL_KEYSTORE_PASSWORD }}
          MAIL_KEY_ALIAS: ${{ secrets.MAIL_KEY_ALIAS }}
          MAIL_KEY_PASSWORD: ${{ secrets.MAIL_KEY_PASSWORD }}
          MAIL_KEYSTORE_PATH: ${{ runner.temp }}/mail-release.jks
        run: |
          set -euo pipefail
          test -n "$MAIL_RELEASE_KEYSTORE_BASE64"
          test -n "$MAIL_KEYSTORE_PASSWORD"
          test -n "$MAIL_KEY_ALIAS"
          test -n "$MAIL_KEY_PASSWORD"

          printf '%s' "$MAIL_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$MAIL_KEYSTORE_PATH"
          test -s "$MAIL_KEYSTORE_PATH"

          EXPECTED_SHA1="79:89:FB:E1:1C:32:36:B4:9E:76:AE:32:50:12:18:9D:CE:2B:6E:80"
          ACTUAL_SHA1="$(
            keytool -list -v \
              -keystore "$MAIL_KEYSTORE_PATH" \
              -storepass "$MAIL_KEYSTORE_PASSWORD" \
              -alias "$MAIL_KEY_ALIAS" \
              -keypass "$MAIL_KEY_PASSWORD" |
            sed -nE 's/^[[:space:]]*SHA1:[[:space:]]*//p' |
            head -n1
          )"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "ERROR: release keystore SHA-1 does not match the registered Google OAuth certificate."
            echo "Expected: $EXPECTED_SHA1"
            echo "Actual:   $ACTUAL_SHA1"
            exit 1
          fi

          echo "Release keystore SHA-1 verified: $ACTUAL_SHA1"

      - name: Build arm64 release APK
        env:
          GOOGLE_SERVER_CLIENT_ID: 1057557137418-g440cu974hf39b1k4qhumag6lhbpkdnb.apps.googleusercontent.com
          MAIL_RELEASE_KEYSTORE_BASE64: ${{ secrets.MAIL_RELEASE_KEYSTORE_BASE64 }}
          MAIL_KEYSTORE_PASSWORD: ${{ secrets.MAIL_KEYSTORE_PASSWORD }}
          MAIL_KEY_ALIAS: ${{ secrets.MAIL_KEY_ALIAS }}
          MAIL_KEY_PASSWORD: ${{ secrets.MAIL_KEY_PASSWORD }}
          MAIL_KEYSTORE_PATH: ${{ runner.temp }}/mail-release.jks
        run: |
          set -euo pipefail
          printf '%s' "$MAIL_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$MAIL_KEYSTORE_PATH"
          test -s "$MAIL_KEYSTORE_PATH"

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          test -x "$APKSIGNER"

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$CERT_OUTPUT"

          CERT_SHA1="$(
            printf '%s\n' "$CERT_OUTPUT" |
            sed -nE 's/^.*certificate SHA-1 digest:[[:space:]]*//p' |
            head -n1 |
            tr -d '[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )"
          EXPECTED_SHA1="7989FBE11C3236B49E76AE325012189DCE2B6E80"

          if [ "$CERT_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "ERROR: APK signing SHA-1 does not match the registered Google OAuth certificate."
            echo "Expected: $EXPECTED_SHA1"
            echo "Actual:   $CERT_SHA1"
            exit 1
          fi

          echo "APK signing SHA-1 verified: $CERT_SHA1"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mail-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Commit generated Android and formatting changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android lib test analysis_options.yaml
          git diff --cached --quiet || git commit -m "build: sync generated Android and Dart formatting [skip ci]"
          git push
