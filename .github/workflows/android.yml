name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.hyouka --project-name mail mail_generated
            rm -rf android
            cp -r mail_generated/android android
            rm -rf mail_generated
          fi

      - name: Get packages
        run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Validate Google OAuth configuration
        env:
          GOOGLE_SERVER_CLIENT_ID: 1057557137418-g440cu974hf39b1k4qhumag6lhbpkdnb.apps.googleusercontent.com
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVER_CLIENT_ID"
          case "$GOOGLE_SERVER_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo "ERROR: GOOGLE_SERVER_CLIENT_ID is not a Google OAuth client ID."
              exit 1
              ;;
          esac

          APPLICATION_ID="$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n1)"
          if [ "$APPLICATION_ID" != "com.hyouka.mail" ]; then
            echo "ERROR: unexpected Android applicationId: $APPLICATION_ID"
            exit 1
          fi

          echo "Android applicationId: $APPLICATION_ID"
          echo "Web/server client ID: $GOOGLE_SERVER_CLIENT_ID"
          echo "Google Cloud must contain an Android OAuth client for this package and the SHA-1 of the certificate used by the APK."
          echo "The web/server client and Android OAuth client must belong to the same Google Cloud project."

      - name: Build arm64 release APK
        env:
          GOOGLE_SERVER_CLIENT_ID: 1057557137418-g440cu974hf39b1k4qhumag6lhbpkdnb.apps.googleusercontent.com
        run: |
          flutter build apk             --release             --target-platform android-arm64             --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Report release signing fingerprint
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :app:signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mail-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Commit generated Android and formatting changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android lib test analysis_options.yaml
          git diff --cached --quiet || git commit -m "build: sync generated Android and Dart formatting [skip ci]"
          git push
